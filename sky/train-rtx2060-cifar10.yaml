name: train-rtx2060-cifar10

workdir: .

resources:
  accelerators: {RTX2060: 1}

setup: |
  set -euo pipefail
  python -m pip install --upgrade pip
  python -m pip install -r requirements-rtx2060-cifar.txt
  python - <<'PY'
  import torch
  import torchvision
  print("torch", torch.__version__)
  print("torchvision", torchvision.__version__)
  print("cuda_available", torch.cuda.is_available())
  if torch.cuda.is_available():
      print("cuda_device", torch.cuda.get_device_name(0))
      print("bf16_supported", torch.cuda.is_bf16_supported())
  PY

run: |
  set -euo pipefail
  python scripts/train_rtx2060_cifar10.py --epochs 5 --train-samples 12000 --val-samples 3000 --batch-size 128
