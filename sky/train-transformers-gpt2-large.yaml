name: train-transformers-gpt2-large

workdir: .

resources:
  accelerators: {RTX4090:1}

setup: |
  set -euo pipefail
  python -m pip install uv==0.11.13
  uv pip install --system --exclude-newer '7 days' -r requirements-transformers.txt
  python - <<'PY'
  import torch
  import transformers
  print("torch", torch.__version__)
  print("transformers", transformers.__version__)
  print("cuda_available", torch.cuda.is_available())
  if torch.cuda.is_available():
      print("cuda_device", torch.cuda.get_device_name(0))
      print("bf16_supported", torch.cuda.is_bf16_supported())
  PY

run: |
  set -euo pipefail
  python scripts/train_transformers_causal_lm.py --model-name gpt2-large --steps 8 --seq-len 256 --batch-size 1 --grad-accum 2 --dtype bf16
