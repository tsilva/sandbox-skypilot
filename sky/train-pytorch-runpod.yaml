name: train-pytorch-runpod

workdir: .

resources:
  infra: runpod
  accelerators: {L4:1, RTX4090:1}

setup: |
  set -euo pipefail
  python -m pip install uv==0.11.13
  uv pip install --system --exclude-newer '7 days' -r requirements-train.txt
  python - <<'PY'
  import torch
  print("torch", torch.__version__)
  print("cuda_available", torch.cuda.is_available())
  PY

run: |
  set -euo pipefail
  python scripts/train_torch.py --epochs 5 --samples 8192 --batch-size 256
