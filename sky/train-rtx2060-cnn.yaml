name: train-rtx2060-cnn

workdir: .

resources:
  accelerators: {RTX2060: 1}

setup: |
  set -euo pipefail
  python -m pip install --upgrade pip
  python -m pip install -r requirements-rtx2060-cnn.txt
  python - <<'PY'
  import torch
  print("torch", torch.__version__)
  print("cuda_available", torch.cuda.is_available())
  if torch.cuda.is_available():
      print("cuda_device", torch.cuda.get_device_name(0))
      print("bf16_supported", torch.cuda.is_bf16_supported())
  PY

run: |
  set -euo pipefail
  python scripts/train_rtx2060_cnn.py --epochs 6 --steps-per-epoch 80 --batch-size 128 --image-size 64
