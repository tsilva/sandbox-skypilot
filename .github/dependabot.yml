version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python-control-plane:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /
    # uv owns the control-plane manifest and lock; pip owns remote requirements.
    ignore:
      - dependency-name: skypilot
      - dependency-name: runpod
      # GPU versions and Unsloth extras are validated as a coupled stack.
      - dependency-name: torch
      - dependency-name: torchvision
      - dependency-name: xformers
      - dependency-name: unsloth
      - dependency-name: unsloth-zoo
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      remote-python-stacks:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
