version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-control-plane:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /
    # uv owns the control-plane manifest and lock; pip owns remote requirements.
    ignore:
      - dependency-name: skypilot
      - dependency-name: runpod
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      remote-python-stacks:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
