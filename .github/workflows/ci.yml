name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.13"
          python-version: "3.11"
          enable-cache: true

      - name: Install the locked control plane
        run: uv sync --locked --no-config --exclude-newer '7 days'

      - name: Resolve every remote manifest
        shell: bash
        run: |
          for manifest in requirements-*.txt; do
            uv pip compile "$manifest" \
              --no-config \
              --exclude-newer '7 days' \
              --python-version 3.11 \
              --python-platform x86_64-manylinux_2_28 \
              --output-file "${RUNNER_TEMP}/${manifest}"
          done

      - name: Lint and test
        run: |
          uv run --locked --no-config --exclude-newer '7 days' ruff check .
          uv run --locked --no-config --exclude-newer '7 days' pytest -q
          uv run --locked --no-config --exclude-newer '7 days' python -m compileall -q scripts

      - name: Smoke-test the SkyPilot CLI
        run: |
          uv run --locked --no-config --exclude-newer '7 days' sky --help >/dev/null
          uv run --locked --no-config --exclude-newer '7 days' sky status --help >/dev/null
          uv run --locked --no-config --exclude-newer '7 days' sky launch --help >/dev/null
          uv run --locked --no-config --exclude-newer '7 days' sky check --help >/dev/null

      - name: Audit locked dependencies
        run: >-
          uv audit --locked --no-config --exclude-newer '7 days'
          --python-platform x86_64-manylinux_2_28
