[project]
name = "sandbox-skypilot"
version = "0.1.0"
description = "Small SkyPilot sandbox for switching between RunPod, Hyperbolic, and Lambda Cloud."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "runpod>=1.6",
  "skypilot[hyperbolic,lambda,runpod]>=0.12.3,<0.13",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "ruff>=0.14.14",
]

[tool.uv]
exclude-newer = "7 days"
constraint-dependencies = [
  "gitpython>=3.1.62",
  "mako>=1.4.2",
  "multidict>=6.9.1",
  "pyjwt>=2.15.0",
  "urllib3>=2.8.0",
  "guardrails-ai!=0.10.1",
  "mistralai!=2.4.6",
]
override-dependencies = [
  "click>=8.3.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
